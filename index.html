<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Filter Wajah Wisuda dan Kampus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { overflow: hidden; background: #111; color: #fff; width: 100vw; height: 100vh; }
    #ar-container { position: fixed; inset: 0; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 10;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .controls {
      pointer-events: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding-bottom: 12px;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #btn-switch { background: #ffffff; color: #111; }
    #btn-photo { background: #2563eb; color: #fff; }
    #alert-box {
      display: none;
      pointer-events: auto;
      position: fixed;
      inset: 20px;
      margin: auto;
      max-width: 420px;
      height: fit-content;
      background: #1f2937;
      border: 1px solid #ef4444;
      border-radius: 16px;
      padding: 20px;
      z-index: 30;
      line-height: 1.5;
    }
    #alert-box h3 { color: #fca5a5; margin-bottom: 8px; font-size: 17px; }
    #alert-box p { font-size: 14px; color: #e5e7eb; margin-bottom: 14px; word-break: break-word; }
    #btn-retry { background: #ef4444; color: #fff; width: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.175.0",
        "three/addons/": "https://esm.sh/three@0.175.0/examples/jsm/",
        "mindar-face-three": "https://esm.sh/mind-ar@1.2.5/dist/mindar-face-three.prod.js?deps=three@0.175.0"
      }
    }
  </script>
</head>
<body>
  <div id="ar-container"></div>

  <div id="hud">
    <div class="top-bar">
      <div class="badge" id="status-text">Menyiapkan kamera...</div>
      <div class="badge" id="filter-name">Filter: Topi Toga Kampus</div>
    </div>

    <div class="controls">
      <button id="btn-switch" type="button">Ganti Filter</button>
      <button id="btn-photo" type="button">Ambil Foto</button>
    </div>
  </div>

  <div id="alert-box">
    <h3>Kamera Tidak Dapat Diakses</h3>
    <p id="alert-message"></p>
    <button id="btn-retry" type="button">Coba Lagi</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-face-three';

    const statusEl = document.getElementById('status-text');
    const filterNameEl = document.getElementById('filter-name');
    const alertBox = document.getElementById('alert-box');
    const alertMessage = document.getElementById('alert-message');
    const btnSwitch = document.getElementById('btn-switch');
    const btnPhoto = document.getElementById('btn-photo');
    const btnRetry = document.getElementById('btn-retry');

    const FILTERS = [
      {
        name: 'Topi Toga Kampus',
        url: './graduation_cap_pro.glb',
        anchor: 10,
        pos: [0, 0.35, 0],
        scale: [0.45, 0.45, 0.45],
        spin: true
      },
      {
        name: 'Kacamata Kampus',
        url: './glasses.glb',
        anchor: 168,
        pos: [0, 0.02, 0.05],
        scale: [0.35, 0.35, 0.35],
        spin: false
      }
    ];

    let currentIdx = 0;
    let activeModel = null;
    let activeMixer = null;
    let currentAnchor = null;
    let mindarThree = null;
    const loader = new GLTFLoader();
    const clock = new THREE.Clock();

    function showError(msg) {
      statusEl.textContent = 'Terjadi kendala';
      alertMessage.textContent = msg;
      alertBox.style.display = 'block';
    }

    async function setFilter(idx) {
      if (!mindarThree) return;
      currentIdx = (idx + FILTERS.length) % FILTERS.length;
      const item = FILTERS[currentIdx];

      if (currentAnchor && activeModel) {
        currentAnchor.group.remove(activeModel);
      }
      activeModel = null;
      activeMixer = null;

      currentAnchor = mindarThree.addAnchor(item.anchor);
      filterNameEl.textContent = `Filter: ${item.name}`;
      statusEl.textContent = `Memuat ${item.name}...`;

      try {
        const gltf = await loader.loadAsync(item.url);
        const model = gltf.scene;
        model.position.set(...item.pos);
        model.scale.set(...item.scale);
        model.userData.spin = item.spin;

        if (gltf.animations && gltf.animations.length > 0) {
          activeMixer = new THREE.AnimationMixer(model);
          activeMixer.clipAction(gltf.animations[0]).play();
        }

        currentAnchor.group.add(model);
        activeModel = model;
        statusEl.textContent = 'Arahkan wajah ke kamera';
      } catch (err) {
        console.error(err);
        statusEl.textContent = `Gagal muat ${item.url}`;
      }
    }

    async function startAR() {
      try {
        statusEl.textContent = 'Menyiapkan MindAR...';
        mindarThree = new MindARThree({
          container: document.querySelector('#ar-container')
        });

        const { renderer, scene, camera } = mindarThree;
        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
        dirLight.position.set(0, 2, 3);
        scene.add(dirLight);

        statusEl.textContent = 'Meminta izin kamera...';
        await mindarThree.start();

        await setFilter(0);

        renderer.setAnimationLoop(() => {
          const delta = clock.getDelta();
          if (activeMixer) activeMixer.update(delta);
          if (activeModel && activeModel.userData.spin) {
            activeModel.rotation.y += delta * 1.1;
          }
          renderer.render(scene, camera);
        });
      } catch (err) {
        console.error(err);
        if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
          showError('Izin kamera ditolak. Aktifkan izin kamera di pengaturan browser lalu tekan Coba Lagi.');
        } else {
          showError(`Gagal memulai kamera/AR: ${err && err.message ? err.message : err}`);
        }
      }
    }

    btnSwitch.addEventListener('click', () => {
      setFilter(currentIdx + 1);
    });

    btnPhoto.addEventListener('click', () => {
      if (!mindarThree) return;
      const video = document.querySelector('#ar-container video');
      const glCanvas = mindarThree.renderer.domElement;
      if (!video || !glCanvas) return;

      const width = glCanvas.width || video.videoWidth || 720;
      const height = glCanvas.height || video.videoHeight || 1280;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = width;
      outCanvas.height = height;
      const ctx = outCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);
      ctx.drawImage(glCanvas, 0, 0, width, height);

      outCanvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `filter-wisuda-kampus-${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        statusEl.textContent = 'Foto tersimpan di perangkat';
      }, 'image/png');
    });

    btnRetry.addEventListener('click', () => window.location.reload());

    startAR();
  </script>
</body>
</html>
